.endTitle{text-align:center;font-size:1.9rem;font-weight:900;color:#ffd23f;margin-bottom:6px}

@media (max-width:820px){
 h1{font-size:1.8rem}

 #dash{width:min(262px,70vw)}
 .worlds{grid-template-columns:repeat(2,1fr)}
 #toast{bottom:110px}
}
</style>

function beep(f,d,type,v,slide){
 if(!S.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v||0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

function buildLevel(wi,fast){
 const seq=SEQ[wi].filter(s=>!(fast&&FAST_SKIP.includes(s)));
 const L={wi,solids:[],coins:[],picks:[],hearts:[],jars:[],walkers:[],spikes:[],blocks:[],gates:[],flags:[],boss:null,end:0,len:0,spawn:2};
 let x=0;
 const solid=(sx,sy,w,h,kind)=>{const s={x:sx,y:sy,w,h,kind};L.solids.push(s);return s;};
 const ground=(w,top)=>solid(x,-6,w,6+(top||0),'ground');
 const coinLine=(cx,cy,n,dx)=>{for(let i=0;i<n;i++)L.coins.push({x:cx+i*(dx||0.9),y:cy,got:false});};
 const coinArc=(cx,n,h,span)=>{for(let i=0;i<n;i++){const t=n>1?i/(n-1):0.5;L.coins.push({x:cx+t*span,y:0.9+Math.sin(t*Math.PI)*h,got:false});}};
 solid(-3,-6,3,60,'wall');
 for(const seg of seq){
  const[name,arg]=seg.split(':');
  switch(name){
   case'start':ground(10);L.spawn=2.5;x+=10;break;
   case'coins':ground(14);coinLine(x+2,0.7,9);x+=14;break;
   case'blocks':{ground(16);const bx=x+5;
    [['coin'],['pick'],['coin']].forEach((t,i)=>{const b={x:bx+i,y:2,w:1,h:1,type:t[0],id:t[0]==='pick'?arg:null,used:false,bump:0};L.blocks.push(b);const s=solid(b.x,b.y,1,1,'block');s.blk=b;});
    coinLine(x+10,0.7,4);x+=16;break;}
   case'platform':{ground(18);solid(x+4,1.5,3,0.5,'plat');solid(x+9,2.7,3,0.5,'plat');solid(x+14,1.5,2,0.5,'plat');
    coinLine(x+4.6,2.6,3);coinLine(x+14.4,2.6,2);
    if(arg)L.picks.push({x:x+10.5,y:4.1,id:arg,got:false});
    L.hearts.push({x:x+15,y:2.9,got:false});x+=18;break;}
   case'gap':{const w=Number(arg||3);coinArc(x,5,1.5,w);x+=w;break;}
   case'gap2':{coinArc(x,4,1.4,3);x+=3;ground(4);L.jars.push({x:x+2,y:0.9,got:false});x+=4;coinArc(x,4,1.4,3);x+=3;break;}
   case'walkers':{ground(18);
    L.walkers.push({x:x+6,y:0,w:0.9,h:0.8,x0:x+3,x1:x+9,dir:1,alive:true,sp:1.6});
    L.walkers.push({x:x+14,y:0,w:0.9,h:0.8,x0:x+11,x1:x+16.5,dir:-1,alive:true,sp:1.9});
    coinLine(x+2,0.7,3);coinLine(x+8.5,2.0,4);x+=18;break;}
   case'spikes':{ground(16);L.spikes.push({x:x+7,y:0,w:2,h:0.55});coinArc(x+5.5,6,2.1,5);x+=16;break;}
   case'stairs':{const hs=[0,1,2,1,0],ws=[3,2,2,2,3];
    hs.forEach((h,i)=>{ground(ws[i],h);coinLine(x+0.5,h+0.7,Math.max(1,ws[i]-1));if(i===2)L.jars.push({x:x+1,y:h+0.9,got:false});x+=ws[i];});break;}
   case'checkpoint':ground(8);L.flags.push({x:x+4,active:false});x+=8;break;
   case'gate':ground(10);L.gates.push({x:x+5,k:Number(arg),done:false});x+=10;break;
   case'boss':ground(24);L.boss={gateX:x+9,x:x+15.5,done:false,gate:false};x+=24;break;
   case'goal':ground(16);L.end=x+9;x+=16;break;
  }
 }
 L.len=x;solid(x,-6,3,60,'wall');
 return L;
}

 renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
/* serpihan kilauan */
const SPK={list:[],init(){const g=new THREE.SphereGeometry(0.08,6,6);for(let i=0;i<90;i++){const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));m.visible=false;m.userData={vx:0,vy:0,vz:0,life:0};scene.add(m);this.list.push(m);}},
 burst(x,y,color,n){if(!ok3D)return;let k=0;for(const m of this.list){if(k>=n)break;if(m.userData.life>0)continue;m.visible=true;m.material.color.set(color);m.material.opacity=1;m.position.set(x,y,0.6);const a=Math.random()*6.28,s=2+Math.random()*4;m.userData.vx=Math.cos(a)*s;m.userData.vy=Math.sin(a)*s+2;m.userData.vz=(Math.random()-.5)*2;m.userData.life=0.7+Math.random()*0.4;k++;}},
 update(dt){for(const m of this.list){const u=m.userData;if(u.life<=0)continue;u.life-=dt;u.vy-=12*dt;m.position.x+=u.vx*dt;m.position.y+=u.vy*dt;m.position.z+=u.vz*dt;m.material.opacity=Math.max(0,u.life);if(u.life<=0)m.visible=false;}}};
function worldToScreen(x,y){
 if(ok3D){const v=new THREE.Vector3(x,y,0).project(camera);return[(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight];}
 return[(x-CAM.x)*sc2D()+innerWidth/2,innerHeight*0.72-(y-Math.max(0,CAM.y-2.4))*sc2D()];
}
function popText(x,y,text,color){const[sx,sy]=worldToScreen(x,y);const d=document.createElement('div');d.className='pop';d.textContent=text;d.style.left=sx+'px';d.style.top=sy+'px';d.style.color=color||'#ffd23f';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
function toast(text){const d=document.createElement('div');d.textContent=text;const t=$('toast');t.appendChild(d);while(t.children.length>3)t.firstChild.remove();setTimeout(()=>d.remove(),3200);}

function setSky(W){
 const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,W.sky[0]);g.addColorStop(1,W.sky[1]);x.fillStyle=g;x.fillRect(0,0,2,256);
 scene.background=new THREE.CanvasTexture(c);scene.fog=new THREE.Fog(new THREE.Color(W.sky[1]).getHex(),50,150);
}
function clearScene(){
 if(SCN.grp){scene.remove(SCN.grp);SCN.grp.traverse(o=>{if(o.userData&&o.userData.own&&o.geometry)o.geometry.dispose();});}
 SCN.grp=null;SCN.player=null;SCN.boss=null;SCN.gates=[];SCN.flags=[];SCN.goal=null;
}
function mkBox(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MAT(c));}
function mkTree(s,c1,c2){
 const g=new THREE.Group();
 const tr=new THREE.Mesh(GEO('trunk',()=>new THREE.CylinderGeometry(.15,.2,.8,6)),MAT(0x8d5a2b));tr.scale.setScalar(s);tr.position.y=.4*s;
 const l1=new THREE.Mesh(GEO('cone1',()=>new THREE.ConeGeometry(.9,1.4,8)),MAT(c1||0x2e9e4f));l1.scale.setScalar(s);l1.position.y=1.3*s;
 const l2=new THREE.Mesh(GEO('cone2',()=>new THREE.ConeGeometry(.7,1.1,8)),MAT(c2||0x37b45c));l2.scale.setScalar(s);l2.position.y=2*s;
 g.add(tr,l1,l2);return g;
}
function mkPalm(s){

 for(let i=0;i<6;i++){const l=new THREE.Mesh(GEO('leaf',()=>new THREE.ConeGeometry(.22,1.9,5)),MAT(0x2fae5a));const a=i/6*Math.PI*2;l.scale.setScalar(s);l.position.set(Math.cos(a)*.8*s+.2,3.2*s,Math.sin(a)*.8*s);l.rotation.z=Math.cos(a)>0?-1.25:1.25;l.rotation.x=Math.sin(a)*1.1;g.add(l);}

function addDecor(grp,W,L,wi){
 const rng=mulberry(wi*97+5);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(900,300),MAT(W.floor));floor.rotation.x=-Math.PI/2;floor.position.set(L.len/2,wi===1?-3.4:-9.5,-40);grp.add(floor);
 for(let x=-12;x<L.len+40;x+=11+rng()*7){
  const z=-6-rng()*11,k=W.decor;
  let m=null;
  if(k==='village'){const t=rng();m=t<.45?mkHouse([0xff8a65,0x64b5f6,0xffd54f,0xba68c8][Math.floor(rng()*4)],[0xb71c1c,0x37474f,0x6d4c41][Math.floor(rng()*3)],2.4+rng()*1.6,2+rng()*1.4,2.2):mkTree(1.3+rng()*.9);}
  else if(k==='island'){const t=rng();m=t<.55?mkPalm(1+rng()*.7):(t<.8?mkHouse(0xffffff,0xe53935,3+rng(),2.4,2.4):mkTree(1.1));}
  else if(k==='city'){m=mkBuilding(3+rng()*3,6+rng()*14,3,[0x8fa6c8,0xb7a4d6,0x9ad0c8,0xd0a9a9][Math.floor(rng()*4)],rng);}
  else if(k==='mountain'){m=rng()<.55?mkMountain(4+rng()*4,7+rng()*9):mkTree(1.4+rng(),0x2d7a4a,0x358f58);}
  else{ // future
   m=new THREE.Group();const isl=new THREE.Mesh(new THREE.CylinderGeometry(2.2,1.3,.7,9),MAT(0x9a7bff));const cn=new THREE.Mesh(new THREE.ConeGeometry(1.3,1.8,9),MAT(0x5b3fd0));cn.rotation.x=Math.PI;cn.position.y=-1.2;
   const cr=new THREE.Mesh(new THREE.OctahedronGeometry(.7),new THREE.MeshLambertMaterial({color:0x7ff3ff,emissive:0x2288aa}));cr.position.y=1.2;m.add(isl,cn,cr);m.position.y=2+rng()*7;
  }
  if(m){m.position.x=x;m.position.z=z;if(k!=='future')m.position.y=0;else m.position.z=z-4;grp.add(m);if(k!=='future'||true)m.userData.decor=true;}
  if(rng()<.45){const c=mkCloud();c.position.set(x+rng()*8,9+rng()*8,-22-rng()*14);const s=1+rng()*1.6;c.scale.setScalar(s);if(k==='future'){c.children.forEach(ch=>ch.material=BAS(0xffe0f4));}grp.add(c);}
 }
 // atas tanah dalam jurang: lantai hanya jauh di belakang; tambah kabus sempadan
}

function qTex(used){return TEX('q'+used,128,128,(c,w,h)=>{c.fillStyle=used?'#8a8a8a':'#f7b500';c.fillRect(0,0,w,h);c.strokeStyle=used?'#5e5e5e':'#a86b00';c.lineWidth=8;c.strokeRect(4,4,w-8,h-8);c.fillStyle=used?'#6b6b6b':'#fff3b0';c.font='bold 88px "Trebuchet MS",sans-serif';c.textAlign='center';c.textBaseline='middle';if(!used)c.fillText('?',w/2,h/2+6);});}

function buildScene(wi,fast){
 const W=WORLDS[wi];const L=buildLevel(wi,fast);SCN.L=L;
 if(!ok3D)return L;
 clearScene();setSky(W);
 const grp=new THREE.Group();scene.add(grp);SCN.grp=grp;
 const dirt=MAT(W.dirt),top=MAT(W.ground),lip=MAT(new THREE.Color(W.ground).multiplyScalar(1.12).getHex());
 for(const s of L.solids){
  if(s.kind==='wall'||s.kind==='block')continue;
  const d=s.kind==='ground'?4:3;const geo=new THREE.BoxGeometry(s.w,s.h,d);
  const m=new THREE.Mesh(geo,[dirt,dirt,top,dirt,dirt,dirt]);m.userData.own=true;
  m.position.set(s.x+s.w/2,s.y+s.h/2,0);m.receiveShadow=true;m.castShadow=s.kind!=='ground';grp.add(m);
  const l=new THREE.Mesh(new THREE.BoxGeometry(s.w+.04,.16,d+.04),lip);l.userData.own=true;l.position.set(s.x+s.w/2,s.y+s.h-.08,0);grp.add(l);
 }
 // blok soalan
 for(const b of L.blocks){
  const m=new THREE.Mesh(GEO('blk',()=>new THREE.BoxGeometry(1,1,1)),new THREE.MeshLambertMaterial({map:qTex(false)}));
  m.position.set(b.x+.5,b.y+.5,0);m.castShadow=true;grp.add(m);b.mesh=m;
 }
 for(const c of L.coins){const m=new THREE.Mesh(GEO('coin',()=>{const g=new THREE.CylinderGeometry(.3,.3,.08,18);g.rotateX(Math.PI/2);return g;}),new THREE.MeshLambertMaterial({color:0xffc928,emissive:0x7a5200}));m.position.set(c.x,c.y,0);grp.add(m);c.mesh=m;}
 for(const p of L.picks){const m=mkShieldMesh(p.id);m.position.set(p.x,p.y,0);grp.add(m);p.mesh=m;}
 for(const h of L.hearts){const m=mkHeart();m.position.set(h.x,h.y,0);grp.add(m);h.mesh=m;}
 for(const j of L.jars){const m=mkJar();m.position.set(j.x,j.y,0);grp.add(m);j.mesh=m;}
 for(const w of L.walkers){const m=mkWalker();m.position.set(w.x,w.y,0);grp.add(m);w.mesh=m;}
 for(const s of L.spikes){const g=new THREE.Group();const n=Math.round(s.w/.5);const base=mkBox(s.w,.1,1.4,0x4a1414);base.position.set(s.w/2,.05,0);g.add(base);for(let i=0;i<n;i++){const c=new THREE.Mesh(GEO('spk',()=>new THREE.ConeGeometry(.24,.6,6)),MAT(0xe53935));c.position.set(.25+i*.5,.38,0);c.castShadow=true;g.add(c);}g.position.set(s.x,s.y,0);grp.add(g);}
 for(const gt of L.gates){const m=mkGate();m.position.set(gt.x,0,0);grp.add(m);gt.mesh=m;}
 for(const f of L.flags){const m=mkFlag();m.position.set(f.x,0,0);grp.add(m);f.mesh=m;}
 const goal=mkGoal();goal.position.set(L.end,0,-.8);grp.add(goal);SCN.goal=goal;
 if(L.boss){const m=mkBoss(wtxt(wi,'boss'));m.position.set(L.boss.x,0,0);m.rotation.y=-.35;grp.add(m);L.boss.mesh=m;
  const gm=mkGate();gm.position.set(L.boss.gateX,0,0);gm.userData.sign.material.map=null;grp.add(gm);L.boss.gateMesh=gm;gm.visible=false;}
 const pm=mkPlayerMesh(R&&R.pl?R.pl.color:COLORS[0],R&&R.pl?R.pl.name:'Aiman');grp.add(pm);SCN.player=pm;pm.visible=!!R;
 addDecor(grp,W,L,wi);
 return L;
}

/* ============================================================
   FIZIK & LOGIK LEVEL
   ============================================================ */
function overlapP(P,s){return P.x+P.w/2>s.x+0.0005&&P.x-P.w/2<s.x+s.w-0.0005&&P.y+P.h>s.y+0.0005&&P.y<s.y+s.h-0.0005;}
function stepPhysics(dt){
 const r=R,P=r.P,L=r.L,pl=r.pl;
 P.inv=Math.max(0,P.inv-dt);P.coy=P.onGround?PH.coyote:Math.max(0,P.coy-dt);P.buf=Math.max(0,P.buf-dt);
 if(INP.jumpPressed){P.buf=PH.buf;INP.jumpPressed=false;}
 const dir=(INP.right?1:0)-(INP.left?1:0);
 if(dir)P.face=dir;
 const target=dir*PH.speed,a=dir===0?PH.decel:(P.onGround?PH.accel:PH.air);
 if(P.vx<target)P.vx=Math.min(target,P.vx+a*dt);else if(P.vx>target)P.vx=Math.max(target,P.vx-a*dt);
 if(P.buf>0&&P.coy>0){P.vy=PH.jump;P.buf=0;P.coy=0;P.onGround=false;P.jumping=true;sfx('jump');}
 if(!INP.jump&&P.vy>0&&P.jumping){P.vy*=0.5;P.jumping=false;}
 if(P.vy<=0)P.jumping=false;
 P.vy=Math.max(PH.maxfall,P.vy-PH.g*dt);
 // X
 P.x+=P.vx*dt;
 for(const s of L.solids){if(Math.abs(s.x+s.w/2-P.x)>s.w/2+2)continue;if(!overlapP(P,s))continue;
  if(P.vx>0)P.x=s.x-P.w/2-0.001;else if(P.vx<0)P.x=s.x+s.w+P.w/2+0.001;P.vx=0;}
 // Y
 P.onGround=false;P.y+=P.vy*dt;
 for(const s of L.solids){if(Math.abs(s.x+s.w/2-P.x)>s.w/2+2)continue;if(!overlapP(P,s))continue;
  if(P.vy<=0){P.y=s.y+s.h;P.vy=0;P.onGround=true;}else{P.y=s.y-P.h-0.001;P.vy=0;if(s.blk)bumpBlock(s.blk);}}
 P.run=Math.abs(P.vx)/PH.speed;
 if(P.y<-9){fallDown();return;}
 // syiling & item
 const near=(o,rx,ry)=>Math.abs(o.x-P.x)<rx&&o.y>P.y-ry&&o.y<P.y+P.h+ry;
 for(const c of L.coins)if(!c.got&&near(c,.6,.3))collectCoin(c);
 for(const p of L.picks)if(!p.got&&near(p,.75,.5)){p.got=true;p.mesh&&(p.mesh.visible=false);gainInstrument(pl,p.id,p.x,p.y);}
 for(const h of L.hearts)if(!h.got&&near(h,.7,.4)){h.got=true;h.mesh&&(h.mesh.visible=false);addHeart(h.x,h.y);}
 for(const j of L.jars)if(!j.got&&near(j,.8,.4)){j.got=true;j.mesh&&(j.mesh.visible=false);pl.sav+=200;pl.risk-=1;normalize(pl);r.got.jars++;sfx('pick');SPK.burst(j.x,j.y,0xff9ec4,14);popText(j.x,j.y+.8,tr('+RM200 simpanan','+RM200 savings'),'#ffb3d1');toast(tr('Tabung simpanan: +RM200 simpanan','Piggy bank: +RM200 savings'));updateHUD();}
 // bendera semak
 for(const f of L.flags)if(!f.active&&Math.abs(f.x-P.x)<0.8){f.active=true;r.cp=f.x;if(f.mesh)f.mesh.userData.fl.material=BAS(0x2fd36b);sfx('good');toast(tr('Titik semak disimpan!','Checkpoint saved!'));SPK.burst(f.x,2.2,0x2fd36b,10);}
 // musuh
 for(const w of L.walkers){if(!w.alive)continue;w.x+=w.dir*w.sp*dt;if(w.x<w.x0){w.x=w.x0;w.dir=1;}if(w.x>w.x1){w.x=w.x1;w.dir=-1;}
  if(P.x+P.w/2>w.x-w.w/2&&P.x-P.w/2<w.x+w.w/2&&P.y<w.y+w.h&&P.y+P.h>w.y){
   if(P.vy<0&&P.y>w.y+w.h*0.4){w.alive=false;P.vy=PH.stomp;P.jumping=false;pl.cash+=30;pl.risk-=1;pl.stomps++;normalize(pl);sfx('stomp');SPK.burst(w.x,.5,0xb78cff,12);popText(w.x,1.2,tr('Risiko dikurangkan! +RM30','Risk reduced! +RM30'),'#c9a8ff');r.got.stomps++;updateHUD();if(w.mesh)w.mesh.visible=false;}
   else if(P.inv<=0)damage(tr('Dilanggar risiko!','Hit by a risk!'));}}
 for(const s of L.spikes){if(P.x+P.w/2>s.x&&P.x-P.w/2<s.x+s.w&&P.y<s.y+s.h)if(P.inv<=0)damage(tr('Terkena perangkap hutang!','Caught in a debt trap!'));}
 // gate & bos
 if(!r.pending){
  for(const g of L.gates)if(!g.done&&Math.abs(g.x-P.x)<0.55){g.done=true;r.pending={ev:locEv(r.wi,g.k),gate:g,boss:false};break;}
  if(!r.pending&&L.boss&&!L.boss.done&&P.x>=L.boss.gateX){L.boss.done=true;r.pending={ev:locEv(r.wi,2),gate:null,boss:true};}
  if(!r.pending&&L.boss&&L.boss.done&&!r.done&&P.x>=L.end)finishLevel();
 }
}
function bumpBlock(b){
 if(b.used)return;b.used=true;b.bump=0.25;sfx('bump');
 if(b.mesh){b.mesh.material=new THREE.MeshLambertMaterial({map:qTex(true)});}
 if(b.type==='coin'){const c={x:b.x+.5,y:b.y+1.2,got:false};collectCoin(c);}
 else gainInstrument(R.pl,b.id,b.x+.5,b.y+1.2);
 SPK.burst(b.x+.5,b.y+1,0xffd23f,8);
}
function collectCoin(c){
 c.got=true;if(c.mesh)c.mesh.visible=false;const pl=R.pl;pl.coins++;pl.cash+=20;R.got.coins++;sfx('coin');SPK.burst(c.x,c.y,0xffd23f,5);popText(c.x,c.y+.5,'+RM20','#ffd23f');updateHUD();
}
function addHeart(x,y){
 if(R.hearts<5)R.hearts++;R.pl.risk=clamp(R.pl.risk-1,0,100);sfx('pick');SPK.burst(x,y,0xff3b5c,12);popText(x,y+.7,tr('+1 nyawa','+1 life'),'#ff7b9c');updateHUD();
}
function gainInstrument(pl,id,x,y){
 const I=INS[id],nm=iname(id);
 if(pl.owned.has(id)){pl.cash+=50;sfx('coin');popText(x,y+.7,'Bonus +RM50','#ffd23f');toast(tr(`Anda sudah ada ${nm}. Bonus RM50!`,`You already own ${nm}. RM50 bonus!`));updateHUD();return;}
 pl.owned.add(id);const pay=(I.cost||0)+(I.inv||0)+(I.sav||0);

 const note=pay?tr(` (kos ${rm(pay)})`,` (cost ${rm(pay)})`):tr(' (tanpa premium)',' (no premium)');
 toast(`🛡️ ${nm} ${tr('dimiliki','acquired')}${note}: ${tr('perlindungan','protection')} +${I.prot}`);updateHUD();
}
function damage(msg){
 const P=R.P;R.hearts--;R.pl.risk=clamp(R.pl.risk+2,0,100);P.inv=1.6;P.vy=8;P.vx=-P.face*6;P.onGround=false;sfx('hurt');
 SPK.burst(P.x,P.y+.6,0xff5555,10);toast(msg+tr(' -1 nyawa',' -1 life'));updateHUD();

function fallDown(){
 const P=R.P;R.hearts--;R.pl.risk=clamp(R.pl.risk+2,0,100);sfx('hurt');updateHUD();
 if(R.hearts<=0){onDefeat();return;}

async function runEvent(pend){

 G.state='cut';clearInput();sfx('alert');
 CAM.cut={x:boss?r.L.boss.x-3:r.P.x,y:boss?1.5:r.P.y};

 if(o.need&&!meets(pl,o.need)){fx=(ev.fail||DEFAULT_FAIL).slice();fb=ev.failMsg||tr('Anda belum memiliki perlindungan yang diperlukan, jadi kos terpaksa ditanggung sendiri.','You do not own the protection needed, so you must bear the cost yourself.');q='bad';ins=null;}
 pl.cash+=fx[0];pl.sav+=fx[1];pl.inv+=fx[2];pl.prot+=fx[3];pl.risk+=fx[4];normalize(pl);
 r.hearts=clamp(r.hearts+(fx[5]||0),0,5);

 pl.log.push({ev:ev.t,choice:o.t,q});pl.cnt[q]++;r.events++;

 if(pend.gate&&pend.gate.mesh){pend.gate.mesh.userData.field.material.color.set(0x44dd77);}
 r.pending=null;
 if(r.hearts<=0){G.state='play';onDefeat();return;}
 G.state='play';
}

let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(R&&G.state==='play'&&!G.paused){R.t+=dt;if(R.pending&&!R.busy){R.busy=true;const p=R.pending;runEvent(p).finally(()=>{if(R)R.busy=false;});}else{const n=2;for(let i=0;i<n&&G.state==='play'&&!R.pending;i++)stepPhysics(dt/n);}}
 updateCam(dt);animate(dt);
 if(ok3D){SPK.update(dt);renderer.render(scene,camera);}else render2D();
 if(R&&G.state==='play')updateProgress();
}
function updateCam(dt){
 const asp=innerWidth/innerHeight,zm=asp<1?1.75:asp<1.45?1.25:1;
 let tx,ty,tz=14.5*zm;
 if(CAM.cut){tx=CAM.cut.x;ty=CAM.cut.y+1.0;tz=7.5*zm;}
 else if(R&&R.P&&G.state!=='menu'&&G.state!=='select'){tx=R.P.x+R.P.face*2.2;ty=Math.max(2.1,R.P.y+1.2);}
 else{CAM.att+=dt*2.2;const span=Math.max(10,((SCN.L&&SCN.L.len)||60)-30);tx=8+(CAM.att%span);ty=2.4;}
 const k=Math.min(1,dt*(CAM.snap?100:4.5));CAM.snap=false;
 CAM.x+=(tx-CAM.x)*k;CAM.y+=(ty-CAM.y)*k;CAM.z+=(tz-CAM.z)*Math.min(1,dt*4);
 if(ok3D){camera.position.set(CAM.x,CAM.y+2.2,CAM.z);camera.lookAt(CAM.x,CAM.y,0);sun.position.set(CAM.x+9,18,12);sun.target.position.set(CAM.x,0,0);}
}
function animate(dt){
 const L=SCN.L;if(!L||!ok3D)return;const t=performance.now()/1000;
 for(const c of L.coins)if(c.mesh&&!c.got)c.mesh.rotation.y=t*4+c.x;
 for(const p of L.picks)if(p.mesh&&!p.got){p.mesh.position.y=p.y+Math.sin(t*3+p.x)*.18;p.mesh.userData.spin.rotation.y=Math.sin(t*2)*.5;}
 for(const h of L.hearts)if(h.mesh&&!h.got){h.mesh.position.y=h.y+Math.sin(t*3+h.x)*.15;h.mesh.rotation.y=t*2.5;}
 for(const j of L.jars)if(j.mesh&&!j.got){j.mesh.position.y=j.y+Math.sin(t*3+j.x)*.12;j.mesh.rotation.y=Math.sin(t*2)*.6;}
 for(const w of L.walkers)if(w.mesh&&w.alive){w.mesh.position.set(w.x,w.y+Math.abs(Math.sin(t*6+w.x))*.12,0);w.mesh.rotation.y=w.dir>0?.9:-.9;}
 for(const b of L.blocks){if(b.mesh){b.bump=Math.max(0,b.bump-dt);b.mesh.position.y=b.y+.5+Math.sin(b.bump/.25*Math.PI)*.3;}}
 for(const g of L.gates)if(g.mesh){const f=g.mesh.userData.field;if(!g.done)f.material.opacity=.15+Math.sin(t*4)*.08;else f.material.opacity=.1;}
 for(const f of L.flags)if(f.mesh)f.mesh.userData.fl.position.y=2.2+Math.sin(t*3+f.x)*.05;
 if(SCN.goal)SCN.goal.userData.fl.rotation.y=Math.sin(t*2)*.3;
 if(L.boss&&L.boss.mesh){
  const bm=L.boss.mesh;
  if(R&&R.bossDefeat){const d=R.bossDefeat;d.t+=dt;const k=Math.max(0,1-d.t/1.2);bm.scale.setScalar(Math.max(0.001,k));bm.rotation.y+=dt*10;bm.position.y=(1-k)*3;if(d.t<0.05&&d.good)for(let i=0;i<5;i++)SPK.burst(L.boss.x,2.5,[0xffd23f,0xff5577,0x55ddff][i%3],16);if(k<=0.001){bm.visible=false;R.bossDefeat=null;}}
  else if(!L.boss.done||(R&&!R.bossDefeat&&bm.visible)){bm.position.y=Math.abs(Math.sin(t*2))*.25;bm.rotation.y=-.35+Math.sin(t)*.2;}
 }
 // pemain
 if(SCN.player&&R&&R.P){
  const P=R.P,m=SCN.player,u=m.userData;m.visible=true;
  m.position.set(P.x,P.y,0);
  m.rotation.y+=((P.face>0?1.1:-1.1)-m.rotation.y)*Math.min(1,dt*14);
  u.phase+=dt*(6+P.run*9);
  if(!P.onGround){u.legL.rotation.x=-.7;u.legR.rotation.x=.6;u.armL.rotation.x=-2.4;u.armR.rotation.x=-2.2;}
  else if(P.run>.05){const s=Math.sin(u.phase)*.95*P.run;u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s;u.armR.rotation.x=s;}
  else{u.legL.rotation.x=u.legR.rotation.x=0;u.armL.rotation.x=u.armR.rotation.x=0;u.body.scale.y=1+Math.sin(t*3)*.03;}
  const sq=P.onGround?1:1+clamp(P.vy/40,-.12,.12);m.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  m.visible=P.inv<=0||Math.floor(t*14)%2===0;
 }
}

function sc2D(){return Math.min(innerHeight/11,58);}
function render2D(){
 const cv=$('c2'),ctx=cv.getContext('2d'),w=cv.width,h=cv.height,sc=sc2D(),L=SCN.L;if(!L)return;
 const W=WORLDS[L.wi],gy=h*0.72,oy=Math.max(0,CAM.y-2.4);
 const X=x=>(x-CAM.x)*sc+w/2,Y=y=>gy-(y-oy)*sc;
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,W.sky[0]);g.addColorStop(1,W.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 for(const s of L.solids){if(s.kind==='wall')continue;if(s.kind==='block')continue;ctx.fillStyle='#'+W.dirt.toString(16).padStart(6,'0');ctx.fillRect(X(s.x),Y(s.y+s.h),s.w*sc,s.h*sc);ctx.fillStyle='#'+W.ground.toString(16).padStart(6,'0');ctx.fillRect(X(s.x),Y(s.y+s.h),s.w*sc,Math.min(10,s.h*sc));}
 ctx.font=(sc*.7)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 for(const b of L.blocks){ctx.fillStyle=b.used?'#888':'#f7b500';ctx.fillRect(X(b.x),Y(b.y+1),sc,sc);ctx.fillStyle='#fff';ctx.fillText(b.used?'':'?',X(b.x+.5),Y(b.y+.5));}
 ctx.fillStyle='#ffc928';for(const c of L.coins)if(!c.got){ctx.beginPath();ctx.arc(X(c.x),Y(c.y),sc*.28,0,7);ctx.fill();}
 for(const p of L.picks)if(!p.got)ctx.fillText(INS[p.id].ico,X(p.x),Y(p.y));
 for(const q of L.hearts)if(!q.got)ctx.fillText('❤️',X(q.x),Y(q.y));
 for(const q of L.jars)if(!q.got)ctx.fillText('🐷',X(q.x),Y(q.y));
 for(const q of L.walkers)if(q.alive)ctx.fillText('👾',X(q.x),Y(q.y+.4));
 for(const s of L.spikes){ctx.fillStyle='#e53935';ctx.fillRect(X(s.x),Y(s.y+s.h),s.w*sc,s.h*sc);}
 for(const q of L.gates)ctx.fillText(q.done?'✅':'⚠️',X(q.x),Y(2.5));
 for(const q of L.flags)ctx.fillText('🚩',X(q.x),Y(1));
 if(L.boss&&!(R&&R.bossDefeat)&&(!L.boss.done||true)&&!(L.boss.done&&L.boss.mesh&&false))ctx.fillText(L.boss.done?'':'👹',X(L.boss.x),Y(1.8));
 ctx.fillText('🏠',X(L.end),Y(1.5));
 if(R&&R.P){const P=R.P;ctx.fillStyle=R.pl.color;if(P.inv<=0||Math.floor(performance.now()/70)%2)ctx.fillRect(X(P.x-P.w/2),Y(P.y+P.h),P.w*sc,P.h*sc);}
}

const TTS={on:false,tok:0,rate:1,voices:[],sup:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),
 refresh(){if(!this.sup)return;try{const v=speechSynthesis.getVoices();if(v&&v.length)this.voices=v;}catch(e){}},
 voice(){
  const want=LANG==='en'?['en-gb','en-us','en-au','en-in','en']:['ms-my','ms','id-id','id'];
  const norm=v=>(v.lang||'').replace('_','-').toLowerCase();
  for(const w of want){const v=this.voices.find(x=>norm(x)===w)||this.voices.find(x=>norm(x).startsWith(w));if(v)return v;}
  return null;
 },
 say(i,tok){
  if(!this.on||tok!==this.tok)return;
  const H=HOW[LANG];if(i>=H.length){this.stop();return;}
  hlHow(i);
  const u=new SpeechSynthesisUtterance(H[i].say);const v=this.voice();
  if(v){u.voice=v;u.lang=v.lang;}else u.lang=LANG==='en'?'en-GB':'ms-MY';
  u.rate=this.rate;
  u.onend=()=>{if(this.on&&tok===this.tok)this.say(i+1,tok);};
  u.onerror=()=>{if(this.on&&tok===this.tok)this.say(i+1,tok);};
  try{speechSynthesis.speak(u);}catch(e){this.stop();}
 },
 start(){
  if(!this.sup){voiceNote();return;}
  this.refresh();this.on=true;const tok=++this.tok;
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>this.say(0,tok),80);playBtn();voiceNote();
 },
 stop(){this.on=false;this.tok++;try{if(this.sup)speechSynthesis.cancel();}catch(e){}hlHow(-1);playBtn();}
};
if(TTS.sup){TTS.refresh();try{speechSynthesis.onvoiceschanged=()=>{TTS.refresh();voiceNote();};}catch(e){}}
function hlHow(i){document.querySelectorAll('#howCard .hs').forEach((el,k)=>{el.classList.toggle('hl',k===i);if(k===i)el.scrollIntoView({block:'nearest',behavior:'smooth'});});}
function playBtn(){const b=$('hwPlay');if(b)b.textContent=TTS.on?tr('⏹ Henti Audio','⏹ Stop Audio'):tr('🔊 Dengar Penerangan','🔊 Listen to the Guide');}
function voiceNote(){
 const el=$('hwVoice');if(!el)return;
 if(!TTS.sup){el.textContent=tr('Pelayar atau peranti ini tidak menyokong audio penerangan. Cuba Chrome, Edge atau Safari.','This browser or device does not support the audio guide. Try Chrome, Edge or Safari.');return;}
 TTS.refresh();const v=TTS.voice();
 if(!v){el.textContent=tr('Suara Bahasa Melayu tidak dijumpai pada peranti ini, jadi suara lalai peranti akan digunakan. Anda boleh pasang suara Melayu dalam tetapan teks-ke-ucapan peranti.','No Malay voice was found on this device, so the default voice will be used. You can install a Malay voice in the device text-to-speech settings.');if(LANG==='en')el.textContent='No English voice was found on this device, so the default voice will be used.';return;}
 const lang=(v.lang||'').toLowerCase();
 el.textContent='🔈 '+v.name+' ('+v.lang+')'+((LANG==='ms'&&!lang.startsWith('ms'))?tr(' · menggunakan suara Indonesia yang hampir sama dengan BM',' · using an Indonesian voice, close to Malay'):'');
}
function renderHow(){
 const H=HOW[LANG];
 $('howCard').innerHTML=`<div class="endTitle" style="font-size:1.5rem">${tr('❓ Cara Bermain','❓ How to Play')}</div>
 <div class="row2" style="margin:0 0 6px"><button class="btn purple" id="hwPlay"></button><button class="btn grey" id="hwRate"></button><button class="btn blue" id="hwLang">${tr('🌐 Bahasa: BM  (tukar ke EN)','🌐 Language: EN  (switch to BM)')}</button></div>
 <p class="small" id="hwVoice" style="margin:0 0 6px"></p>
 ${H.map((x,i)=>`<div class="hs" id="hs${i}"><h4>${x.ico} ${x.h}</h4><ul>${x.p.map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('')}
 <div class="row2"><button class="btn green" id="hwClose" style="min-width:140px">${tr('Tutup','Close')}</button></div>`;
 playBtn();rateBtn();voiceNote();
 $('hwPlay').onclick=()=>{if(TTS.on)TTS.stop();else TTS.start();};
 $('hwRate').onclick=()=>{TTS.rate=TTS.rate===1?0.8:TTS.rate===0.8?1.2:1;rateBtn();if(TTS.on)TTS.start();};
 $('hwLang').onclick=()=>setLang(LANG==='en'?'ms':'en');
 $('hwClose').onclick=closeHow;
}
function rateBtn(){const b=$('hwRate');if(b)b.textContent=tr('Kelajuan','Speed')+': '+TTS.rate+'x';}
function openHow(){renderHow();$('how').classList.remove('hidden');$('howCard').scrollTop=0;}
function closeHow(){TTS.stop();$('how').classList.add('hidden');}

/* ============================================================
   MENU
   ============================================================ */
let menuCount=1;
function buildNames(){
 const old=[...document.querySelectorAll('#names input')].map(e=>e.value);
 $('names').innerHTML=Array.from({length:4},(_,i)=>`<div class="${i>=menuCount?'hidden':''}"><label>${tr('Pemain','Player')} ${i+1}</label><input maxlength="12" value="${DEF_NAMES[i]}" style="border-color:${COLORS[i]}"></div>`).join('');
 document.querySelectorAll('#names input').forEach((e,i)=>{if(old[i]!==undefined)e.value=old[i];});
 document.querySelectorAll('#countRow button').forEach(b=>b.classList.toggle('sel',+b.dataset.n===menuCount));
 $('countRow').classList.toggle('hidden',menuCount===1);
}
function openSetup(n){menuCount=n;buildNames();$('setup').classList.remove('hidden');}
$('bSingle').onclick=()=>openSetup(1);
$('bMulti').onclick=()=>openSetup(menuCount>1?menuCount:2);
document.querySelectorAll('#countRow button').forEach(b=>b.onclick=()=>{menuCount=+b.dataset.n;buildNames();});
$('bFast').onclick=()=>{G.fast=!G.fast;applyLang();};
$('bHow').onclick=()=>openHow();
$('bLang').onclick=()=>setLang(LANG==='en'?'ms':'en');
function openSettings(){
 const tl=()=>S.touch==='auto'?tr('AUTO','AUTO'):S.touch==='on'?tr('HIDUP','ON'):tr('MATI','OFF');
 openModal(`<div class="endTitle" style="font-size:1.5rem">${tr('⚙️ Tetapan','⚙️ Settings')}</div><div class="btns">
  <button class="btn grey" id="stSnd"></button>
  <button class="btn grey" id="stTouch"></button>
  <button class="btn blue" id="stLang"></button>
  <button class="btn orange" id="stDel">${tr('Padam simpanan permainan','Delete saved game')}</button>
  <button class="btn green" id="stOk">${tr('Selesai','Done')}</button></div>
  <p class="small">${tr('Mod Pantas: level lebih pendek (satu event + bos setiap dunia), sesuai untuk demonstrasi di kelas.','Fast Mode: shorter levels (one event + boss per world), great for classroom demonstrations.')}</p>`);
 const upd=()=>{$('stSnd').textContent=tr('Bunyi: ','Sound: ')+(S.sound?tr('HIDUP','ON'):tr('MATI','OFF'));$('stTouch').textContent=tr('Butang sentuh: ','Touch buttons: ')+tl();$('stLang').textContent=tr('🌐 Bahasa: BM  (tukar ke EN)','🌐 Language: EN  (switch to BM)');};
 upd();
 $('stSnd').onclick=()=>{S.sound=!S.sound;lsSet('prq_set',JSON.stringify(S));upd();};
 $('stTouch').onclick=()=>{S.touch=S.touch==='auto'?'on':S.touch==='on'?'off':'auto';lsSet('prq_set',JSON.stringify(S));applyTouchSetting();upd();};
 $('stLang').onclick=()=>{setLang(LANG==='en'?'ms':'en');openSettings();};
 $('stDel').onclick=()=>{lsDel('prq_save_v1');$('bCont').classList.add('hidden');$('stDel').textContent=tr('Simpanan dipadam','Save deleted');};
 $('stOk').onclick=closeModal;
}
$('bSet').onclick=openSettings;
$('bStart').onclick=()=>{
 const names=[...document.querySelectorAll('#names input')].slice(0,menuCount).map((e,i)=>(e.value.trim()||DEF_NAMES[i]).slice(0,12));
 G.players=names.map((n,i)=>newPlayer(i,n));G.world=0;beginGame();
};
$('bCont').onclick=()=>{
 const sv=loadSave();if(!sv)return;
 G.fast=!!sv.fast;G.world=sv.world;
 G.players=sv.players.map(d=>{const p=newPlayer(d.idx,d.name);Object.assign(p,{cash:d.cash,sav:d.sav,inv:d.inv,prot:d.prot,risk:d.risk,coins:d.coins||0,cnt:d.cnt||p.cnt,log:d.log||[],stomps:d.stomps||0});p.owned=new Set(d.owned||[]);return p;});
 beginGame();
};
function beginGame(){$('menu').classList.add('hidden');mainFlow();}
$('bDash').onclick=toggleDash;
$('bPause').onclick=()=>{if(G.state==='play')pauseGame();};
$('bHow2').onclick=()=>{if(G.state==='play')pauseGame();openHow();};

/* ============================================================
   MULA
   ============================================================ */
applyTouchSetting();
applyLang();
init3D();
if(!ok3D){$('c').classList.add('hidden');$('c2').classList.remove('hidden');resize();$('menu').querySelector('.small').insertAdjacentHTML('beforebegin','<p class="small" style="color:#ffd23f">'+tr('Paparan 3D tidak dapat dimuatkan (semak sambungan internet). Permainan berjalan dalam paparan 2D ringkas.','3D view could not load (check your internet connection). The game runs in a simple 2D view.')+'</p>');}
buildScene(0,false);
if(loadSave())$('bCont').classList.remove('hidden');
requestAnimationFrame(frame);
window.__prq={G,get R(){return R},S,EVS,INS,WORLDS,TTS,tp:(x,y)=>{if(R){R.P.x=x;R.P.y=y==null?1:y;R.P.vy=0;}}};
</script>
